name: Manual Go agent image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing reviewed release tag (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: manual-agent-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ inputs.version }}', fetch-depth: 0}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - name: Verify tag, release, and immutable image name
        env: {VERSION: '${{ inputs.version }}', GH_TOKEN: '${{ github.token }}'}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          node scripts/release/verify.mjs "$VERSION"
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft then error("Release is a draft") else . end'
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Reject an existing immutable tag
        env: {VERSION: '${{ inputs.version }}'}
        run: |
          if docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}/agent:${VERSION}" > /tmp/image-inspection.txt 2>&1; then
            echo 'Image tag already exists; choose a new release version'; exit 1
          fi
          if ! grep -Eq 'not found|manifest unknown' /tmp/image-inspection.txt; then
            cat /tmp/image-inspection.txt; exit 1
          fi
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: 'ghcr.io/${{ github.repository }}/agent:${{ inputs.version }}'
          build-args: 'VERSION=${{ inputs.version }}+${{ env.REVISION }}'
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - name: Record image digest
        env: {DIGEST: '${{ steps.image.outputs.digest }}', REVISION: '${{ env.REVISION }}', VERSION: '${{ inputs.version }}'}
        run: jq -n --arg digest "$DIGEST" --arg revision "$REVISION" --arg version "$VERSION" '{digest:$digest,revision:$revision,version:$version}' > agent-image.json
      - uses: actions/upload-artifact@v4
        with: {name: agent-image, path: agent-image.json}
